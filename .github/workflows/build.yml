name: Build

# Testet und baut die App bei jeder Änderung an main.
# Das fertige Paket für den Webspace liegt danach im Lauf unter "Artifacts".

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: portablegames-webspace
          path: dist
          include-hidden-files: true
