name: Build

# Testet und baut die App bei jeder Änderung an main.
# Das fertige Paket liegt danach im Lauf unter "Artifacts".
# Sind die FTP-Zugangsdaten hinterlegt, wird es zusätzlich auf den Webspace geladen.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - uses: actions/upload-artifact@v7
        with:
          name: portablegames-webspace
          path: dist
          include-hidden-files: true

      - name: Auf den Webspace laden
        env:
          READY: ${{ secrets.FTP_SERVER != '' && secrets.FTP_USERNAME != '' && secrets.FTP_PASSWORD != '' && vars.FTP_DIR != '' }}
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          LFTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_DIR: ${{ vars.FTP_DIR }}
        if: env.READY == 'true'
        run: |
          sudo apt-get install -y -qq lftp > /dev/null
          scripts/deploy-ftp.sh
